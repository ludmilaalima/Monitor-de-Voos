<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Voos</title>
    <script src="monitor.js" defer></script>
</head>
<body>
    <h1>Monitores</h1>  
    <form id="monitorForm" action="/criar-monitor" method="post">
        <p><label for="origem_iata">Origem:</label>
           <input type="text" name="origin_iata" id="origem_iata"></p> 
        
        <p><label for="destino_iata">Destino:</label>
            <input type="text" name="destination_iata" id="destino_iata"></p>
        <p><label for="data_viagem">Data da Viagem:</label>
            <input type="text" name="departure_date" id="data_viagem"></p>
        
        <p><label for="tipo_viagem">Tipo da viagem</label>
        <input type="text" name="trip_type" id="tipo_viagem"></p>


        <p><input type="submit" value="Iniciar Monitoração"></p>
    </form>
    
</body>
</html>
